<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
龙没有耳朵 · 3D无限跑酷
</title>


<style>

body{

margin:0;
overflow:hidden;
background:#000;
font-family:Arial;

}


canvas{

display:block;

}


#ui{

position:absolute;
top:20px;
left:20px;

color:white;

font-size:22px;

z-index:10;

text-shadow:
2px 2px 5px black;

}


#title{

position:absolute;

top:10px;
width:100%;

text-align:center;

color:white;

font-size:26px;

z-index:10;

}



#gameover{

position:absolute;

display:none;

top:40%;

width:100%;

text-align:center;

color:white;

z-index:20;

}


#gameover h1{

font-size:50px;

}



button{

font-size:22px;

padding:12px 30px;

border-radius:12px;

border:none;

}


.controls{

position:absolute;

bottom:30px;

width:100%;

text-align:center;

z-index:20;

}



.controls button{

width:70px;

height:60px;

margin:5px;

background:#ffffffaa;

}



</style>

</head>



<body>


<div id="title">
🐉 龙没有耳朵 · 3D跑酷
</div>


<div id="ui">

距离:
<span id="distance">0</span>

<br>

金币:
<span id="coins">0</span>

</div>



<div id="gameover">

<h1>
游戏结束
</h1>

<button onclick="restart()">
重新开始
</button>

</div>



<div class="controls">

<button onclick="moveLeft()">⬅</button>

<button onclick="jump()">⬆</button>

<button onclick="moveRight()">➡</button>

</div>



<script src="
https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js
"></script>



<script>


let scene;
let camera;
let renderer;


let player;


let roads=[];

let obstacles=[];

let coins=[];


let score=0;

let coinCount=0;


let gameRunning=true;


let speed=0.35;


let jumpPower=0;


let isJumping=false;



// 初始化


function init(){



scene=new THREE.Scene();


scene.background=
new THREE.Color(
0x87ceeb
);



// 摄像机

camera=
new THREE.PerspectiveCamera(

75,

window.innerWidth/
window.innerHeight,

0.1,

1000

);



camera.position.set(
0,
4,
7
);



// 渲染

renderer=
new THREE.WebGLRenderer({

antialias:true

});


renderer.setSize(

window.innerWidth,

window.innerHeight

);


document.body.appendChild(
renderer.domElement
);



// 光源


let light=
new THREE.DirectionalLight(
0xffffff,
2
);


light.position.set(
5,
10,
5
);


scene.add(light);



// 环境光

scene.add(
new THREE.AmbientLight(
0xffffff,
0.5
)
);



// 创建道路

createRoad();


// 创建玩家

createPlayer();


// 开始循环

animate();


}




// 创建道路


function createRoad(){



for(
let i=0;
i<80;
i++
){


let geo=
new THREE.BoxGeometry(
10,
0.1,
5
);


let mat=
new THREE.MeshStandardMaterial({

color:
0x333333

});



let road=
new THREE.Mesh(
geo,
mat
);



road.position.z=
-i*5;



scene.add(road);


roads.push(road);


}


}

// 创建玩家

function createPlayer(){


let geo=
new THREE.BoxGeometry(
0.8,
1.8,
0.8
);



let mat=
new THREE.MeshStandardMaterial({

color:0x00ff99

});



player=
new THREE.Mesh(
geo,
mat
);



player.position.y=1;


scene.add(player);


}



// 玩家移动

function moveLeft(){

if(!gameRunning)return;

player.position.x-=0.5;


if(player.position.x<-3){

player.position.x=-3;

}

}



function moveRight(){

if(!gameRunning)return;

player.position.x+=0.5;


if(player.position.x>3){

player.position.x=3;

}

}




// 跳跃

function jump(){


if(
!isJumping
&&gameRunning
){

isJumping=true;

jumpPower=0.35;


}


}




// 键盘控制


document.addEventListener(
"keydown",
function(e){


if(e.code==="ArrowLeft"
||e.code==="KeyA"){

moveLeft();

}



if(e.code==="ArrowRight"
||e.code==="KeyD"){

moveRight();

}



if(
e.code==="Space"
||e.code==="ArrowUp"
){

jump();

}



});





// 生成障碍


function createObstacle(){


if(!gameRunning)
return;



let geo=
new THREE.BoxGeometry(
1,
1,
1
);



let mat=
new THREE.MeshStandardMaterial({

color:0xff0000

});



let obstacle=
new THREE.Mesh(
geo,
mat
);



obstacle.position.set(

Math.random()*6-3,

0.5,

-100

);



scene.add(obstacle);


obstacles.push(
obstacle
);


}





// 生成金币


function createCoin(){



if(!gameRunning)
return;


let geo=
new THREE.SphereGeometry(
0.3,
16,
16
);



let mat=
new THREE.MeshStandardMaterial({

color:0xffff00

});



let coin=
new THREE.Mesh(
geo,
mat
);



coin.position.set(

Math.random()*6-3,

1,

-100

);



scene.add(coin);


coins.push(
coin
);


}





// 无限道路

function updateRoad(){



roads.forEach(

road=>{


road.position.z+=speed;



if(
road.position.z>10
){


road.position.z-=400;


}


});


}






// 更新障碍


function updateObstacle(){


obstacles.forEach(

o=>{


o.position.z+=speed;



if(
o.position.z>10
){

o.position.z=-100;

}



let distance=
player.position.distanceTo(
o.position
);



if(distance<1){

endGame();

}



});


}





// 更新金币


function updateCoin(){



coins.forEach(

c=>{


c.position.z+=speed;



c.rotation.y+=0.1;



if(
c.position.z>10
){

c.position.z=-100;


}



let distance=
player.position.distanceTo(
c.position
);



if(distance<1){


coinCount++;


document.getElementById(
"coins"
).innerHTML=
coinCount;



c.position.z=100;



}


});


}





// 玩家物理

function updatePlayer(){


if(isJumping){


player.position.y+=jumpPower;


jumpPower-=0.02;



if(
player.position.y<=1
){


player.position.y=1;


isJumping=false;


}


}



}






// 摄像机跟随


function updateCamera(){


camera.position.x=
player.position.x;



camera.position.z=
player.position.z+7;



camera.lookAt(
player.position
);



}






// 分数


function updateScore(){


score++;


document.getElementById(
"distance"
).innerHTML=
score;



}






// 游戏循环


function animate(){


requestAnimationFrame(
animate
);



if(gameRunning){


updateRoad();


updateObstacle();


updateCoin();


updatePlayer();


updateCamera();


updateScore();


}



renderer.render(
scene,
camera
);


}







// 游戏结束


function endGame(){


gameRunning=false;


document.getElementById(
"gameover"
).style.display=
"block";


}






// 重启


function restart(){


location.reload();


}




// 定时生成

setInterval(
createObstacle,
2000
);



setInterval(
createCoin,
1500
);




// 启动

init();



</script>


</body>

</html>
